<!DOCTYPE html>

<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ארנק משפחתי</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f3f4f6; }
        .hide { display: none !important; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
    </style>
</head>
<body class="text-gray-800">

    <!-- Auth Screen -->
    <div id="login-screen" class="min-h-screen flex flex-col justify-center items-center p-6 bg-white hide">
        <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center text-blue-500 text-3xl mb-6 shadow-sm">
            <i class="fas fa-wallet"></i>
        </div>
        <h1 class="text-3xl font-bold mb-2">ארנק משפחתי</h1>
        <p class="text-gray-500 text-center mb-6">התחברו כדי לנהל את כרטיסי המתנה שלכם יחד, מסונכרן בזמן אמת.</p>
        
        <div id="error-message" class="hide bg-red-50 text-red-600 text-sm py-3 px-4 rounded-xl mb-6 text-center border border-red-100 max-w-sm"></div>

        <button id="google-login-btn" class="w-full max-w-sm bg-white border border-gray-300 text-gray-700 font-bold py-3 px-4 rounded-xl shadow-sm flex items-center justify-center gap-3 hover:bg-gray-50 transition-colors">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-6 h-6" alt="Google">
            המשך עם חשבון Google
        </button>
        <p class="text-xs text-gray-400 mt-6 text-center max-w-xs">הגישה מורשית למשתמשים מוגדרים מראש בלבד.</p>
        
        <footer class="mt-auto pt-10 text-xs text-gray-400">
            &copy; 2026 Joseph Gati. All rights reserved.
        </footer>
    </div>

    <!-- Initialization Screen -->
    <div id="loading-screen" class="min-h-screen flex flex-col justify-center items-center bg-white">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mb-4"></div>
        <p class="text-gray-500">מוודא הרשאות גישה...</p>
    </div>

    <!-- Dashboard Container -->
    <div id="app-screen" class="hide min-h-screen pb-24">
        <!-- Top Navigation -->
        <header class="bg-white shadow-sm sticky top-0 z-10 px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-500 text-xl shadow-inner overflow-hidden" id="user-avatar-container">
                    <i class="fas fa-wallet"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">הארנק שלנו</h1>
                    <p class="text-xs text-gray-500" id="user-name-display">מחובר</p>
                </div>
            </div>
            <button id="logout-btn" class="text-gray-400 hover:text-gray-600 p-2">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </header>

        <!-- Data View -->
        <main class="p-4 max-w-3xl mx-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-gray-500 font-medium text-sm">הכרטיסים שלכם</h2>
                <span id="total-balance" class="font-bold text-green-600 bg-green-50 px-3 py-1 rounded-full text-sm">סה"כ: 0 ₪</span>
            </div>
            <div id="cards-container" class="space-y-4">
                <!-- Dynamically populated entries -->
            </div>
            
            <footer class="mt-12 text-center text-xs text-gray-400 pb-4">
                &copy; 2026 Joseph Gati. All rights reserved.
            </footer>
        </main>

        <!-- Action Button -->
        <button onclick="openModal('add')" class="fixed bottom-6 left-6 w-14 h-14 bg-blue-500 text-white rounded-full shadow-lg text-2xl flex items-center justify-center hover:bg-blue-600 transition-transform active:scale-95 z-20">
            <i class="fas fa-plus"></i>
        </button>
    </div>

    <!-- Data Entry Modal -->
    <div id="card-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hide flex justify-center items-end sm:items-center overflow-y-auto">
        <div class="glass-card w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-6 transform transition-transform shadow-2xl mt-10 mb-10">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modal-title" class="text-xl font-bold">הוספת כרטיס חדש</h3>
                <button onclick="closeModal()" class="text-gray-400 p-2"><i class="fas fa-times text-xl"></i></button>
            </div>
            
            <form id="card-form" class="space-y-4">
                <input type="hidden" id="card-id">
                
                <div>
                    <label class="block text-sm text-gray-600 mb-1">שם הכרטיס (למשל: תו הזהב)</label>
                    <input type="text" id="card-name" required class="w-full bg-white border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label class="block text-sm text-gray-600 mb-1">בתי עסק (למשל: שופרסל, קסטרו)</label>
                    <input type="text" id="card-stores" class="w-full bg-white border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label class="block text-sm text-gray-600 mb-1">יתרה מעודכנת (₪)</label>
                    <input type="number" id="card-balance" required min="0" step="0.01" class="w-full bg-white border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 font-bold text-lg text-left" dir="ltr">
                </div>

                <!-- Redemption Details -->
                <div class="mt-4 border-t border-gray-100 pt-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">מספר כרטיס למימוש (אופציונלי)</label>
                    <input type="text" id="card-number" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-left tracking-widest text-lg" dir="ltr" placeholder="1234 5678 9012 3456">
                    
                    <div class="flex gap-4 mt-3">
                        <div class="flex-1">
                            <label class="block text-sm text-gray-600 mb-1">פג תוקף</label>
                            <input type="text" id="card-expiry" placeholder="MM/YY" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 text-center font-mono" dir="ltr">
                        </div>
                        <div class="flex-1">
                            <label class="block text-sm text-gray-600 mb-1">3 ספרות (CVV)</label>
                            <input type="text" id="card-cvv" placeholder="123" maxlength="4" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 text-center font-mono" dir="ltr">
                        </div>
                    </div>
                </div>

                <div class="pt-4 flex gap-3">
                    <button type="submit" class="flex-1 bg-blue-500 text-white font-bold py-3 rounded-xl shadow-sm">שמור כרטיס</button>
                    <button type="button" id="delete-btn" onclick="deleteCard()" class="hide bg-red-100 text-red-500 font-bold py-3 px-5 rounded-xl shadow-sm"><i class="fas fa-trash"></i></button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK Implementation -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc, serverTimestamp, query, orderBy, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithPopup, onAuthStateChanged, signOut, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCdhJTwJSKQ6dibiRhommS1X1uJMDBm7R8",
            authDomain: "family-wallet-78d1d.firebaseapp.com",
            projectId: "family-wallet-78d1d",
            storageBucket: "family-wallet-78d1d.firebasestorage.app",
            messagingSenderId: "891525102323",
            appId: "1:891525102323:web:fcfc950a89b6b47f2bd586"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        
        let currentUser = null;
        window.cardsData = {}; 

        // DOM Elements Mapping
        const loginScreen = document.getElementById('login-screen');
        const loadingScreen = document.getElementById('loading-screen');
        const appScreen = document.getElementById('app-screen');
        const userNameDisplay = document.getElementById('user-name-display');
        const userAvatarContainer = document.getElementById('user-avatar-container');
        const errorMsg = document.getElementById('error-message');

        // Access Verification against Firestore Database by Email
        async function verifyUserAccess(userEmail) {
            try {
                const docRef = doc(db, "allowed_users", userEmail.toLowerCase());
                const docSnap = await getDoc(docRef);
                return docSnap.exists();
            } catch (error) {
                console.error("Access verification failed:", error);
                return false;
            }
        }

        // Auth State Observer
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const isAuthorized = await verifyUserAccess(user.email);
                
                if (!isAuthorized) {
                    await signOut(auth);
                    loadingScreen.classList.add('hide');
                    loginScreen.classList.remove('hide');
                    errorMsg.textContent = "שגיאת אבטחה: חשבון זה אינו מורשה לגשת לארנק המשותף.";
                    errorMsg.classList.remove('hide');
                    return;
                }

                currentUser = user;
                errorMsg.classList.add('hide');
                userNameDisplay.textContent = user.displayName || 'מחובר';
                if(user.photoURL) {
                    userAvatarContainer.innerHTML = `<img src="${user.photoURL}" class="w-full h-full object-cover">`;
                }
                loadingScreen.classList.add('hide');
                loginScreen.classList.add('hide');
                appScreen.classList.remove('hide');
                initializeDataStream();
            } else {
                loadingScreen.classList.add('hide');
                appScreen.classList.add('hide');
                loginScreen.classList.remove('hide');
            }
        });

        // Event Listeners
        document.getElementById('google-login-btn').addEventListener('click', async () => {
            try {
                errorMsg.classList.add('hide');
                loadingScreen.classList.remove('hide');
                loginScreen.classList.add('hide');
                await signInWithPopup(auth, provider);
            } catch (error) {
                loadingScreen.classList.add('hide');
                loginScreen.classList.remove('hide');
                if (error.code !== 'auth/popup-closed-by-user') {
                    errorMsg.textContent = "התחברות בוטלה או נכשלה. נסו שוב.";
                    errorMsg.classList.remove('hide');
                }
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth);
        });

        // Data Subscription
        function initializeDataStream() {
            const dataQuery = query(collection(db, "giftcards"), orderBy("updatedAt", "desc"));
            onSnapshot(dataQuery, (snapshot) => {
                const container = document.getElementById('cards-container');
                container.innerHTML = '';
                let totalBalance = 0;
                window.cardsData = {}; 

                if (snapshot.empty) {
                    container.innerHTML = `
                        <div class="text-center p-8 bg-white rounded-2xl shadow-sm border border-gray-100">
                            <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-3 text-gray-400 text-2xl">
                                <i class="fas fa-ticket-alt"></i>
                            </div>
                            <p class="text-gray-500 mb-1">אין עדיין כרטיסים.</p>
                            <p class="text-sm text-gray-400">לחצו על הפלוס כדי להוסיף כרטיס ראשון.</p>
                        </div>
                    `;
                    document.getElementById('total-balance').textContent = `סה"כ: 0 ₪`;
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const card = docSnap.data();
                    const documentId = docSnap.id;
                    window.cardsData[documentId] = card; 
                    totalBalance += Number(card.balance);
                    
                    const cardElement = document.createElement('div');
                    cardElement.className = 'bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex flex-col gap-3';
                    
                    let componentHTML = `
                        <div class="flex justify-between items-start gap-4">
                            <div class="flex-1 min-w-0">
                                <h3 class="font-bold text-lg text-gray-800 truncate">${card.name}</h3>
                                <p class="text-sm text-gray-500 truncate mb-1"><i class="fas fa-store ml-1 text-gray-400"></i>${card.stores || 'כללי'}</p>
                            </div>
                            <div class="flex flex-col items-end gap-2 shrink-0">
                                <div class="text-xl font-bold text-green-600 bg-green-50 px-3 py-1 rounded-xl">₪${Number(card.balance).toLocaleString('he-IL', {minimumFractionDigits: 0, maximumFractionDigits: 2})}</div>
                                <button onclick="openModal('edit', '${documentId}')" class="text-blue-500 bg-blue-50 w-8 h-8 rounded-full flex items-center justify-center hover:bg-blue-100 transition-colors">
                                    <i class="fas fa-pen text-sm"></i>
                                </button>
                            </div>
                        </div>
                    `;

                    if (card.number) {
                        componentHTML += `
                        <div class="bg-blue-50 rounded-xl p-3 border border-blue-100 mt-1">
                            <div class="text-center font-mono text-xl tracking-widest text-blue-900">${card.number}</div>
                            ${(card.expiry || card.cvv) ? `
                            <div class="flex justify-center gap-6 mt-2 text-sm text-blue-700 font-mono">
                                ${card.expiry ? `<span>תוקף: ${card.expiry}</span>` : ''}
                                ${card.cvv ? `<span>CVV: ${card.cvv}</span>` : ''}
                            </div>
                            ` : ''}
                        </div>
                        `;
                    }

                    componentHTML += `
                        <div class="flex items-center gap-1 mt-1 border-t border-gray-50 pt-2">
                            ${card.updatedByPhoto ? `<img src="${card.updatedByPhoto}" class="w-4 h-4 rounded-full">` : ''}
                            <p class="text-xs text-gray-400">עודכן ע"י ${card.updatedByName ? card.updatedByName.split(' ')[0] : 'משתמש'}</p>
                        </div>
                    `;
                    
                    cardElement.innerHTML = componentHTML;
                    container.appendChild(cardElement);
                });
                
                document.getElementById('total-balance').textContent = `סה"כ: ₪${totalBalance.toLocaleString('he-IL', {minimumFractionDigits: 0, maximumFractionDigits: 2})}`;
            });
        }

        // Modal Controllers
        window.openModal = function(operationMode, documentId = '') {
            const modalComponent = document.getElementById('card-modal');
            const headerTitle = document.getElementById('modal-title');
            const deleteActionBtn = document.getElementById('delete-btn');
            
            document.getElementById('card-id').value = documentId;
            
            if(operationMode === 'add') {
                headerTitle.textContent = 'הוספת כרטיס מתנה';
                deleteActionBtn.classList.add('hide');
                document.getElementById('card-form').reset();
            } else {
                headerTitle.textContent = 'עדכון כרטיס';
                deleteActionBtn.classList.remove('hide');
                
                const activeCardData = window.cardsData[documentId];
                if(activeCardData) {
                    document.getElementById('card-name').value = activeCardData.name || '';
                    document.getElementById('card-stores').value = activeCardData.stores || '';
                    document.getElementById('card-balance').value = activeCardData.balance || '';
                    document.getElementById('card-number').value = activeCardData.number || '';
                    document.getElementById('card-expiry').value = activeCardData.expiry || '';
                    document.getElementById('card-cvv').value = activeCardData.cvv || '';
                }
            }
            modalComponent.classList.remove('hide');
        };

        window.closeModal = function() {
            document.getElementById('card-modal').classList.add('hide');
            document.getElementById('card-form').reset();
        };

        // Data Handlers
        document.getElementById('card-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const targetId = document.getElementById('card-id').value;
            const payload = {
                name: document.getElementById('card-name').value,
                stores: document.getElementById('card-stores').value,
                balance: Number(document.getElementById('card-balance').value),
                number: document.getElementById('card-number').value,
                expiry: document.getElementById('card-expiry').value,
                cvv: document.getElementById('card-cvv').value,
                updatedAt: serverTimestamp(),
                updatedByName: currentUser.displayName,
                updatedByPhoto: currentUser.photoURL
            };

            try {
                if (targetId) {
                    await updateDoc(doc(db, "giftcards", targetId), payload);
                } else {
                    await addDoc(collection(db, "giftcards"), payload);
                }
                closeModal();
            } catch (error) {
                console.error("Transaction failed: ", error);
                alert("אין לך הרשאה לשמור, או שגיאת תקשורת.");
            }
        });

        window.deleteCard = async function() {
            if(confirm('האם אתה בטוח שברצונך למחוק כרטיס זה?')) {
                const targetId = document.getElementById('card-id').value;
                try {
                    await deleteDoc(doc(db, "giftcards", targetId));
                    closeModal();
                } catch (error) {
                    console.error("Deletion failed: ", error);
                }
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ארנק משפחתי</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- הגדרות פונט בעברית -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body {
            font-family: 'Heebo', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .fab {
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4), 0 4px 6px -2px rgba(37, 99, 235, 0.2);
        }

        .google-btn {
            background-color: #ffffff;
            color: #3c4043;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.30), 0 1px 3px 1px rgba(60,64,67,0.15);
            transition: all 0.2s;
        }
        .google-btn:hover {
            background-color: #f8f9fa;
            box-shadow: 0 1px 3px 0 rgba(60,64,67,0.30), 0 4px 8px 3px rgba(60,64,67,0.15);
        }
    </style>
</head>
<body class="text-gray-800 antialiased h-screen flex justify-center overflow-hidden">

    <!-- מסך טעינה התחלתי (עם מנגנון שחרור אוטומטי) -->
    <div id="loading-screen" class="fixed inset-0 bg-white z-[100] flex flex-col justify-center items-center transition-opacity duration-300">
        <i class="ph-bold ph-spinner-gap animate-spin text-5xl text-blue-600 mb-4"></i>
        <p class="text-gray-500 font-medium text-lg">טוען ארנק משפחתי...</p>
    </div>

    <!-- מסך התחברות -->
    <div id="auth-screen" class="hidden w-full max-w-md bg-white h-full flex flex-col justify-center items-center px-8 relative shadow-2xl z-40">
        <div class="text-center mb-10 w-full">
            <div class="inline-flex items-center justify-center w-24 h-24 bg-blue-50 rounded-full text-blue-600 mb-6 shadow-inner">
                <i class="ph-duotone ph-wallet text-5xl"></i>
            </div>
            <h1 class="text-3xl font-black text-gray-900 tracking-tight mb-2">ארנק משפחתי</h1>
            <p class="text-gray-500 text-sm leading-relaxed">התחברו כדי לנהל את כרטיסי המתנה שלכם יחד, מסונכרן בזמן אמת מכל מכשיר.</p>
        </div>

        <button id="btn-google-login" class="google-btn w-full flex items-center justify-center font-medium py-4 px-4 rounded-xl mt-2">
            <svg class="w-6 h-6 ml-3" viewBox="0 0 24 24">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            המשך עם חשבון Google
        </button>
        
        <!-- הודעת שגיאה מיוחדת לחסימת פופאפ -->
        <div id="auth-error-msg" class="hidden mt-6 text-red-700 bg-red-50 p-4 rounded-xl border border-red-200 w-full shadow-sm text-sm">
            <!-- מתוכן על ידי JS -->
        </div>
    </div>

    <!-- המסך הראשי של האפליקציה -->
    <div id="app-screen" class="hidden w-full max-w-md bg-gray-50 h-full flex flex-col relative shadow-2xl">
        
        <!-- Header -->
        <header class="bg-white shadow-sm pt-6 pb-4 px-5 z-10 flex justify-between items-center sticky top-0 rounded-b-2xl">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="relative">
                    <img id="user-avatar" src="" alt="Profile" class="w-12 h-12 rounded-full border-2 border-white shadow-sm object-cover hidden">
                    <div id="user-avatar-placeholder" class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-lg border-2 border-white shadow-sm"></div>
                    <div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-green-500 border-2 border-white rounded-full"></div>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-gray-900 tracking-tight leading-tight">היי, <span id="user-first-name">אורח</span></h1>
                    <p class="text-sm font-medium text-gray-500 mt-0.5" id="total-balance-display">סה"כ יתרה: 0 ₪</p>
                </div>
            </div>
            <button id="btn-logout" class="bg-gray-50 hover:bg-gray-100 p-2.5 rounded-full text-gray-400 hover:text-gray-600 transition-colors" title="התנתק">
                <i class="ph-bold ph-sign-out text-xl"></i>
            </button>
        </header>

        <main class="flex-1 overflow-y-auto no-scrollbar p-5 pb-24 relative" id="cards-container">
            <!-- Data Loading -->
            <div id="data-loading-state" class="flex flex-col items-center justify-center h-full text-gray-400 space-y-4">
                <i class="ph-bold ph-spinner-gap animate-spin text-4xl text-blue-500"></i>
                <p>טוען כרטיסים...</p>
            </div>

            <!-- Empty -->
            <div id="empty-state" class="hidden flex-col items-center justify-center h-full text-gray-400 space-y-4 px-6 text-center mt-10">
                <div class="w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center mb-2">
                    <i class="ph-duotone ph-cards text-5xl text-gray-300"></i>
                </div>
                <h3 class="text-lg font-bold text-gray-600">הארנק ריק</h3>
                <p class="text-sm">לחצו על כפתור הפלוס למטה כדי להוסיף את הכרטיס הראשון שלכם.</p>
            </div>

            <!-- List -->
            <div id="cards-list" class="space-y-4 hidden"></div>
        </main>

        <!-- FAB -->
        <button id="add-fab" class="fab absolute bottom-6 left-6 bg-blue-600 hover:bg-blue-700 text-white w-16 h-16 rounded-full flex items-center justify-center transition-transform active:scale-95 z-20">
            <i class="ph-bold ph-plus text-2xl"></i>
        </button>
    </div>

    <!-- מודל הוספה -->
    <div id="add-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex flex-col justify-end sm:justify-center items-center">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 transform transition-transform translate-y-full duration-300" id="add-modal-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">הוספת כרטיס חדש</h2>
                <button id="close-add-modal" class="bg-gray-100 text-gray-500 hover:bg-gray-200 p-2 rounded-full transition-colors"><i class="ph-bold ph-x text-lg"></i></button>
            </div>
            
            <form id="add-card-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1.5">שם הכרטיס</label>
                    <input type="text" id="input-card-name" required placeholder="לדוגמה: תו הזהב, רב-תו" class="w-full border border-gray-200 bg-gray-50 rounded-xl px-4 py-3 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1.5">איפה מכבדים?</label>
                    <input type="text" id="input-card-stores" required placeholder="לדוגמה: שופרסל, קסטרו" class="w-full border border-gray-200 bg-gray-50 rounded-xl px-4 py-3 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1.5">יתרה ראשונית (₪)</label>
                    <input type="number" id="input-card-balance" required min="0" step="0.01" placeholder="0.00" class="w-full border border-gray-200 bg-gray-50 rounded-xl px-4 py-3 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none text-left font-bold" dir="ltr">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-md mt-6 flex justify-center items-center transition-colors">
                    <span id="add-btn-text">שמור כרטיס</span>
                    <i id="add-btn-spinner" class="ph-bold ph-spinner-gap animate-spin hidden ml-2"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- מודל עדכון -->
    <div id="update-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex flex-col justify-end sm:justify-center items-center">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 transform transition-transform translate-y-full duration-300" id="update-modal-content">
            <div class="flex justify-between items-start mb-2">
                <div>
                    <h2 class="text-xl font-bold text-gray-900" id="update-modal-title">עדכון יתרה</h2>
                    <p class="text-sm text-gray-500 mt-1" id="update-modal-stores">...</p>
                </div>
                <button id="close-update-modal" class="bg-gray-100 text-gray-500 hover:bg-gray-200 p-2 rounded-full transition-colors"><i class="ph-bold ph-x text-lg"></i></button>
            </div>
            
            <form id="update-card-form" class="space-y-4 mt-4">
                <input type="hidden" id="update-card-id">
                <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100">
                    <label class="block text-center text-sm font-bold text-gray-600 mb-2">הקלידו את היתרה שנשארה</label>
                    <div class="relative w-full max-w-[200px] mx-auto">
                        <span class="absolute left-4 top-1/2 transform -translate-y-1/2 text-2xl font-bold text-gray-400">₪</span>
                        <input type="number" id="update-card-balance" required min="0" step="0.01" class="w-full text-3xl font-black text-blue-600 bg-white border-2 border-blue-100 rounded-xl py-3 pl-10 pr-4 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none text-center transition-all shadow-inner" dir="ltr">
                    </div>
                </div>
                
                <div class="flex space-x-3 space-x-reverse mt-6 pt-2 border-t border-gray-100">
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-md transition-colors">
                        שמור יתרה
                    </button>
                    <button type="button" id="btn-pre-delete-card" class="bg-red-50 text-red-600 hover:bg-red-100 font-bold py-3.5 px-5 rounded-xl transition-colors flex items-center justify-center">
                        <i class="ph-bold ph-trash text-xl"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- מודל אישור מחיקה/התנתקות -->
    <div id="confirm-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] hidden flex flex-col justify-center items-center p-4 opacity-0 transition-opacity duration-200">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 text-center transform scale-95 transition-transform duration-200" id="confirm-modal-content">
            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4 text-red-500">
                <i class="ph-fill ph-warning-circle text-3xl"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-900 mb-2" id="confirm-title">האם למחוק?</h3>
            <p class="text-gray-500 text-sm mb-6" id="confirm-desc">לא ניתן לבטל פעולה זו.</p>
            <div class="flex space-x-3 space-x-reverse">
                <button id="btn-confirm-yes" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-xl transition-colors">אישור</button>
                <button id="btn-confirm-no" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-xl transition-colors">ביטול</button>
            </div>
        </div>
    </div>

    <!-- הודעות קופצות למשתמש -->
    <div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-5 py-3 rounded-xl shadow-xl transition-all duration-300 opacity-0 pointer-events-none z-[100] flex items-center space-x-3 space-x-reverse translate-y-[-20px] max-w-[90%] w-max border border-gray-700">
        <i id="toast-icon" class="ph-fill ph-check-circle text-green-400 text-2xl"></i>
        <span id="toast-msg" class="font-medium text-sm"></span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        // חזרנו להשתמש ב Popup בגלל הבאג של הטעינה האינסופית ב Redirect
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, collection, onSnapshot, addDoc, updateDoc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ההגדרות שלך במדויק
        const firebaseConfig = {
            apiKey: "AIzaSyCdhJTwJSKQ6dibiRhommS1X1uJMDBm7R8",
            authDomain: "family-wallet-78d1d.firebaseapp.com",
            projectId: "family-wallet-78d1d",
            storageBucket: "family-wallet-78d1d.firebasestorage.app",
            messagingSenderId: "891525102323",
            appId: "1:891525102323:web:fcfc950a89b6b47f2bd586",
            measurementId: "G-D7HNH0M4L9"
        };

        let app, auth, db, currentUser;
        let cardsList = [];
        let unsubscribeRealtime = null;

        const elLoadingScreen = document.getElementById('loading-screen');
        const elAuthScreen = document.getElementById('auth-screen');
        const elAppScreen = document.getElementById('app-screen');
        const elCardsList = document.getElementById('cards-list');
        const elDataLoading = document.getElementById('data-loading-state');
        const elEmpty = document.getElementById('empty-state');
        const elTotalBalance = document.getElementById('total-balance-display');
        const errorMsgEl = document.getElementById('auth-error-msg');

        // מנגנון הגנה: אחרי 5 שניות טעינה נעצור את הספינר בכל מקרה
        const safetyTimeout = setTimeout(() => {
            if (!currentUser) {
                elLoadingScreen.classList.add('opacity-0');
                setTimeout(() => {
                    elLoadingScreen.classList.add('hidden');
                    showAuthScreen();
                }, 300);
            }
        }, 5000);

        async function init() {
            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                onAuthStateChanged(auth, (user) => {
                    // ברגע שיש תגובה מגוגל, נבטל את טיימר ההגנה 
                    clearTimeout(safetyTimeout);
                    
                    elLoadingScreen.classList.add('opacity-0');
                    setTimeout(() => elLoadingScreen.classList.add('hidden'), 300);
                    
                    if (user) {
                        currentUser = user;
                        setupUserProfile(user);
                        showAppScreen();
                        startRealtimeListener();
                    } else {
                        currentUser = null;
                        showAuthScreen();
                        if(unsubscribeRealtime) unsubscribeRealtime();
                    }
                });
            } catch(e) {
                console.error("Firebase init error:", e);
                clearTimeout(safetyTimeout);
                elLoadingScreen.classList.add('hidden');
                showToast("שגיאה בהפעלת המערכת", "error");
            }
        }

        // התחברות עם חלון קופץ
        document.getElementById('btn-google-login').addEventListener('click', async () => {
            errorMsgEl.classList.add('hidden');
            const provider = new GoogleAuthProvider();
            provider.setCustomParameters({ hl: 'he' }); 
            
            try {
                await signInWithPopup(auth, provider);
                showToast('התחברתם בהצלחה!');
            } catch (error) {
                console.error("Login error:", error);
                
                // הטיפול הספציפי בשגיאה שראית בתמונה הקודמת
                if (error.code === 'auth/popup-blocked') {
                    errorMsgEl.innerHTML = `
                        <div class="flex items-start">
                            <i class="ph-fill ph-warning-circle text-2xl ml-2 mt-0.5"></i>
                            <div>
                                <strong class="block mb-1 text-base">החלון נחסם על ידי הדפדפן!</strong>
                                כדי להתחבר יש ללחוץ על <strong>שלוש הנקודות למעלה (&#8942;)</strong> 
                                ולבחור באפשרות <strong>"פתח בדפדפן" (Open in Chrome)</strong>.
                            </div>
                        </div>`;
                } else if (error.code !== 'auth/popup-closed-by-user' && error.code !== 'auth/cancelled-popup-request') {
                    errorMsgEl.textContent = `שגיאה בהתחברות: ${error.message}`;
                }
                errorMsgEl.classList.remove('hidden');
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            openConfirmModal('התנתקות', 'האם ברצונך להתנתק מהארנק המשפחתי?', () => {
                signOut(auth).then(() => {
                    showToast('התנתקתם בהצלחה.');
                }).catch(() => showToast('שגיאה בהתנתקות', 'error'));
            });
        });

        function setupUserProfile(user) {
            const firstName = user.displayName ? user.displayName.split(' ')[0] : 'אורח';
            document.getElementById('user-first-name').textContent = firstName;
            const avatarImg = document.getElementById('user-avatar');
            const avatarPlaceholder = document.getElementById('user-avatar-placeholder');

            if (user.photoURL) {
                avatarImg.src = user.photoURL;
                avatarImg.classList.remove('hidden');
                avatarPlaceholder.classList.add('hidden');
            } else {
                avatarImg.classList.add('hidden');
                avatarPlaceholder.classList.remove('hidden');
                avatarPlaceholder.textContent = firstName.charAt(0);
            }
        }

        function showAppScreen() {
            elAuthScreen.classList.add('hidden');
            elAppScreen.classList.remove('hidden');
        }

        function showAuthScreen() {
            elAppScreen.classList.add('hidden');
            elAuthScreen.classList.remove('hidden');
            errorMsgEl.classList.add('hidden');
        }

        function startRealtimeListener() {
            if (!currentUser) return;
            
            // Path strictly required by mandatory rules
            const cardsRef = collection(db, 'artifacts', 'family-wallet', 'public', 'data', 'giftcards');
            const q = query(cardsRef); 

            elDataLoading.classList.remove('hidden');
            elCardsList.classList.add('hidden');
            elEmpty.classList.add('hidden');
            
            unsubscribeRealtime = onSnapshot(q, (snapshot) => {
                cardsList = [];
                let total = 0;
                
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    cardsList.push({ id: doc.id, ...data });
                    total += parseFloat(data.balance || 0);
                });

                cardsList.sort((a, b) => b.createdAt - a.createdAt);
                updateUI(total);
            }, (error) => {
                console.error("Fetch error:", error);
                showToast('שגיאה בטעינת הנתונים', 'error');
            });
        }

        function updateUI(totalAmount) {
            elDataLoading.classList.add('hidden');
            elTotalBalance.textContent = `סה"כ יתרה: ₪${totalAmount.toLocaleString('he-IL', {minimumFractionDigits: 0, maximumFractionDigits: 2})}`;

            if (cardsList.length === 0) {
                elEmpty.classList.remove('hidden');
                elCardsList.classList.add('hidden');
            } else {
                elEmpty.classList.add('hidden');
                elCardsList.classList.remove('hidden');
                
                elCardsList.innerHTML = cardsList.map(card => {
                    const balanceFormatted = parseFloat(card.balance).toLocaleString('he-IL', {minimumFractionDigits: 0, maximumFractionDigits: 2});
                    const isLowBalance = parseFloat(card.balance) === 0;
                    
                    const updatedByName = card.lastUpdatedBy || card.creatorName || 'משתמש';
                    const updatedByImg = card.lastUpdatedImg || card.creatorImg;
                    
                    const avatarHTML = updatedByImg ? 
                        `<img src="${updatedByImg}" class="w-4 h-4 rounded-full inline-block ml-1 opacity-90 shadow-sm" alt="avatar" referrerpolicy="no-referrer">` : 
                        `<i class="ph-fill ph-user-circle inline-block ml-1 opacity-70 text-gray-400"></i>`;

                    return `
                    <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 flex flex-col relative overflow-hidden transition-all hover:shadow-md ${isLowBalance ? 'opacity-60 bg-gray-50' : ''}">
                        ${isLowBalance ? '<div class="absolute top-0 right-0 bg-gray-200 text-gray-600 text-[10px] px-3 py-1 rounded-bl-lg font-bold uppercase tracking-wider">נוצל במלואו</div>' : ''}
                        
                        <div class="flex justify-between items-start mb-2 mt-1">
                            <div class="w-full">
                                <h3 class="text-lg font-bold text-gray-900 leading-tight">${escapeHTML(card.name)}</h3>
                                <p class="text-sm text-gray-500 mt-1 flex items-center"><i class="ph-fill ph-storefront text-gray-400 ml-1.5"></i>${escapeHTML(card.stores)}</p>
                            </div>
                        </div>
                        
                        <div class="flex justify-between items-end mt-4 pt-4 border-t border-gray-50">
                            <div>
                                <span class="text-xs font-medium text-gray-400 block mb-0.5 flex items-center">יתרה למימוש</span>
                                <span class="text-3xl font-black tracking-tight ${isLowBalance ? 'text-gray-400' : 'text-blue-600'}">
                                    <span class="text-xl ml-0.5">₪</span>${balanceFormatted}
                                </span>
                            </div>
                            
                            <div class="flex flex-col items-end gap-2">
                                <button onclick="window.openUpdateModal('${card.id}')" class="bg-blue-50 hover:bg-blue-100 text-blue-600 p-2.5 rounded-xl transition-colors h-11 w-11 flex items-center justify-center">
                                    <i class="ph-bold ph-pencil-simple text-xl"></i>
                                </button>
                                <span class="text-[10px] text-gray-500 flex items-center font-medium bg-gray-100 px-2 py-0.5 rounded-full">
                                    ${avatarHTML}
                                    ${escapeHTML(updatedByName)}
                                </span>
                            </div>
                        </div>
                    </div>`;
                }).join('');
            }
        }

        document.getElementById('add-card-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!currentUser) return;

            const name = document.getElementById('input-card-name').value.trim();
            const stores = document.getElementById('input-card-stores').value.trim();
            const balance = document.getElementById('input-card-balance').value;
            const btnText = document.getElementById('add-btn-text');
            const spinner = document.getElementById('add-btn-spinner');

            if(!name || !balance) return;
            btnText.textContent = 'שומר...';
            spinner.classList.remove('hidden');

            try {
                const cardsRef = collection(db, 'artifacts', 'family-wallet', 'public', 'data', 'giftcards');
                await addDoc(cardsRef, {
                    name, stores, balance: parseFloat(balance),
                    createdAt: Date.now(),
                    creatorId: currentUser.uid,
                    creatorName: currentUser.displayName ? currentUser.displayName.split(' ')[0] : 'אורח',
                    creatorImg: currentUser.photoURL || null
                });
                showToast('הכרטיס נוסף בהצלחה!');
                closeModal('add');
                e.target.reset();
            } catch (error) {
                showToast('שגיאה בשמירת הכרטיס', 'error');
            } finally {
                btnText.textContent = 'שמור כרטיס';
                spinner.classList.add('hidden');
            }
        });

        document.getElementById('update-card-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!currentUser) return;

            const id = document.getElementById('update-card-id').value;
            const newBalance = document.getElementById('update-card-balance').value;
            const submitBtn = e.target.querySelector('button[type="submit"]');
            
            submitBtn.textContent = 'מעדכן...';
            submitBtn.disabled = true;

            try {
                const docRef = doc(db, 'artifacts', 'family-wallet', 'public', 'data', 'giftcards', id);
                await updateDoc(docRef, { 
                    balance: parseFloat(newBalance),
                    lastUpdatedBy: currentUser.displayName ? currentUser.displayName.split(' ')[0] : 'אורח',
                    lastUpdatedImg: currentUser.photoURL || null,
                    lastUpdatedAt: Date.now()
                });
                showToast('היתרה עודכנה בהצלחה!');
                closeModal('update');
            } catch (error) {
                showToast('שגיאה בעדכון היתרה', 'error');
            } finally {
                submitBtn.textContent = 'שמור יתרה';
                submitBtn.disabled = false;
            }
        });

        document.getElementById('btn-pre-delete-card').addEventListener('click', () => {
            const id = document.getElementById('update-card-id').value;
            closeModal('update');
            setTimeout(() => {
                openConfirmModal('מחיקת כרטיס', 'האם אתה בטוח שברצונך למחוק כרטיס זה? פעולה זו אינה הפיכה.', async () => {
                    if(!currentUser) return;
                    try {
                        const docRef = doc(db, 'artifacts', 'family-wallet', 'public', 'data', 'giftcards', id);
                        await deleteDoc(docRef);
                        showToast('הכרטיס נמחק לחלוטין.', 'error');
                    } catch (error) {
                        showToast('שגיאה במחיקת הכרטיס', 'error');
                    }
                });
            }, 300);
        });

        document.getElementById('add-fab').addEventListener('click', () => {
            document.getElementById('add-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('add-modal-content').classList.remove('translate-y-full'), 10);
        });

        window.openUpdateModal = (id) => {
            const card = cardsList.find(c => c.id === id);
            if(!card) return;

            document.getElementById('update-card-id').value = id;
            document.getElementById('update-modal-title').textContent = card.name;
            document.getElementById('update-modal-stores').innerHTML = `<i class="ph-fill ph-storefront ml-1"></i>${card.stores}`;
            document.getElementById('update-card-balance').value = card.balance;
            
            document.getElementById('update-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('update-modal-content').classList.remove('translate-y-full'), 10);
        };

        function closeModal(type) {
            const content = document.getElementById(`${type}-modal-content`);
            content.classList.add('translate-y-full');
            setTimeout(() => document.getElementById(`${type}-modal`).classList.add('hidden'), 300);
        }

        document.getElementById('close-add-modal').addEventListener('click', () => closeModal('add'));
        document.getElementById('close-update-modal').addEventListener('click', () => closeModal('update'));
        
        document.getElementById('add-modal').addEventListener('click', (e) => {
            if(e.target === document.getElementById('add-modal')) closeModal('add');
        });
        document.getElementById('update-modal').addEventListener('click', (e) => {
            if(e.target === document.getElementById('update-modal')) closeModal('update');
        });

        let confirmCallback = null;
        const confirmModal = document.getElementById('confirm-modal');
        const confirmModalContent = document.getElementById('confirm-modal-content');
        
        function openConfirmModal(title, desc, callback) {
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-desc').textContent = desc;
            confirmCallback = callback;
            
            confirmModal.classList.remove('hidden');
            setTimeout(() => {
                confirmModal.classList.remove('opacity-0');
                confirmModalContent.classList.remove('scale-95');
            }, 10);
        }

        function closeConfirmModal() {
            confirmModal.classList.add('opacity-0');
            confirmModalContent.classList.add('scale-95');
            setTimeout(() => confirmModal.classList.add('hidden'), 200);
            confirmCallback = null;
        }

        document.getElementById('btn-confirm-yes').addEventListener('click', () => {
            if (confirmCallback) confirmCallback();
            closeConfirmModal();
        });
        document.getElementById('btn-confirm-no').addEventListener('click', closeConfirmModal);

        let toastTimeout;
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            const icon = document.getElementById('toast-icon');
            
            if(type === 'success') {
                icon.className = 'ph-fill ph-check-circle text-green-400 text-2xl';
                toast.classList.remove('border-red-700');
            } else {
                icon.className = 'ph-fill ph-warning-circle text-red-400 text-2xl';
                toast.classList.add('border-red-700');
            }
            
            toast.classList.remove('opacity-0', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-[-20px]');
            }, 3500);
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag] || tag));
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
